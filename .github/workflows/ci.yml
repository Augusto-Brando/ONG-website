name: CI

on:
  push:
    branches: [main, "teste/**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ong
          POSTGRES_PASSWORD: ong
          POSTGRES_DB: ong
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ong" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ong:ong@localhost:5433/ong
      SESSION_SECRET: segredo-apenas-para-o-ci-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Migrações (banco limpo)
        run: npm run db:migrate
      - name: Build
        run: npm run build
